services:
    api:
        restart: always
        hostname: api
        build: .
        ports:
            - '5000:80'
        volumes:
            - "./app:/app/app"
        environment:
            DATABASE_URL: mysql+pymysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-app_db}
        depends_on:
            mysql:
                condition: service_healthy
        command: /start-reload.sh

    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
            MYSQL_USER: ${MYSQL_USER:-app}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql_data:
